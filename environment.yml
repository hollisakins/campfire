# One-shot "everything" environment. For a guided, per-component setup
# (client / reduction / deploy / web) use the installer instead:
#   python3 install.py
name: campfire
channels:
  - conda-forge
dependencies:
  - python>=3.12,<3.14
  - numba>=0.59
  - pip
  - pip:
    - jwst>=1.20,<1.21
    - -e ./layout      # campfire-layout: not on PyPI; must precede the packages that depend on it
    - -e ./pipeline
    - -e ./python

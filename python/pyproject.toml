[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campfire"
version = "0.4.0"
description = "Python client and deployment tools for CAMPFIRE — COSMOS Archive of MultiPle-Field Internal Reductions & Extractions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "CAMPFIRE Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    # Shared directory/key contract (#213). Not on PyPI: kept as a plain name so
    # the editable dev workflow (pip install -e ./layout) resolves it locally.
    # Installing this package from git therefore needs campfire-layout supplied
    # alongside it — see the install snippet in python/README.md / the docs.
    "campfire-layout",
    # Core (auth, API client, CLI)
    "click>=8.0",
    "requests>=2.28.0",
    "astropy>=6.1",
    "numpy>=2.0",
    "tqdm>=4.65.0",
    "packaging",
    "toml>=0.10",
    # Local science stack — spectrum plotting, NIRCam cutouts, calibration &
    # stacking, plus the deploy CLI's RGB/tile/SED generation. Standard in an
    # astronomer's environment, so kept in the base install; only interactive
    # Plotly figures ([plotting]) stay an opt-in extra.
    "scipy>=1.13",
    "matplotlib>=3.9",
    "photutils>=1.13",
    "reproject",
    "Pillow>=10.0",
    # Deploy DB operations
    "supabase>=2.0",
    # Deploy R2 uploads (will be replaced by presigned URLs in future)
    "boto3>=1.28",
]

[project.scripts]
campfire = "campfire.cli:main"

[project.optional-dependencies]
plotting = [
    "plotly>=5.18.0",
]
specutils = [
    "specutils>=1.13",
]
fitsgl = [
    # FitsGL producer (build + deploy the FITS tile-pyramid datasets that back
    # the map/cutout service — epic #337). Not on PyPI and lives in the
    # `fitsgl-py` subdirectory of a separate repo, so this extra pins the git
    # dependency as the reproducible fallback. For local co-development, install
    # the package editable from a side-by-side checkout FIRST, then the base
    # client (which leaves this URL untriggered):
    #     pip install -e ../fitsgl/fitsgl-py[deploy]
    #     pip install -e .
    # See python/README.md and AGENTS.md for the convention.
    "fitsgl[deploy] @ git+https://github.com/hollisakins/fitsgl@main#subdirectory=fitsgl-py",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "mypy>=1.0",
    "plotly>=5.18.0",
    "specutils>=1.13",
]
all = [
    "campfire[plotting,specutils]",
]

[project.urls]
Homepage = "https://github.com/hollisakins/campfire"
Repository = "https://github.com/hollisakins/campfire"

[tool.setuptools.packages.find]
include = ["campfire*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

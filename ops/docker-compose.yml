# CAMPFIRE self-hosted stack: trimmed Supabase + the web portal + Caddy.
#
# Derived from supabase/supabase docker/docker-compose.yml (+ the Kong override)
# at 2026-10-24, with the services CAMPFIRE does not use removed: realtime,
# storage, imgproxy, edge functions, analytics/vector, supavisor. Runbook:
# ops/README.md. Configuration: ops/.env (copy ops/.env.example).
#
# Layout on the VM (CAMPFIRE_DATA_ROOT, default /srv/campfire, the attached
# volume):
#   db/data          Postgres cluster
#   backups          pg_dump staging (ops/scripts/backup.sh)
#   auth-templates   GoTrue email templates, served at https://$API_HOST/templates/
#   certs            Cloudflare origin certificate + key for Caddy
#
# Only Caddy (80/443) listens on all interfaces. Postgres, Kong (Studio) and
# the web server are published on 127.0.0.1 for psql, the SSH-tunnelled
# dashboard and the host-side cron/health scripts.

name: campfire

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  db:
    container_name: campfire-db
    # Hosted project runs 17.6.1.025; stay at or above it so the restored dump
    # never meets an older server. Upgrades: utils/upgrade-pg17.sh upstream.
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    logging: *default-logging
    # Docker's default /dev/shm is 64 MB; parallel workers under a 6 GB
    # shared_buffers need far more.
    shm_size: 1gb
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Sets the service-role passwords from POSTGRES_PASSWORD on first init.
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      # app.settings.jwt_exp for the database.
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ${CAMPFIRE_DATA_ROOT:-/srv/campfire}/db/data:/var/lib/postgresql/data:Z
      # Named volume on purpose: Docker seeds an empty named volume from the
      # image (supautils.conf, wal-g.conf, conf.d/ that postgresql.conf
      # includes); an empty bind mount hides them and the server refuses to
      # start ("configuration file contains errors").
      - db-config:/etc/postgresql-custom
      # Dumps written by backup.sh land here (pg_dump runs inside the container).
      - ${CAMPFIRE_DATA_ROOT:-/srv/campfire}/backups:/backups
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    # The image's postgresql.conf already preloads pg_cron, pg_stat_statements,
    # pgsodium, supautils …; the -c flags below size it for the VM (defaults
    # assume an m3.medium, 8 vCPU / 30 GB) and keep pg_cron on the catalog
    # database so the two scheduled jobs (nightly matview refresh, …) run.
    command:
      [
        "postgres",
        "-c", "config_file=/etc/postgresql/postgresql.conf",
        "-c", "cron.database_name=${POSTGRES_DB:-postgres}",
        "-c", "shared_buffers=${PG_SHARED_BUFFERS:-6GB}",
        "-c", "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-20GB}",
        "-c", "work_mem=${PG_WORK_MEM:-32MB}",
        "-c", "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1GB}",
        "-c", "max_connections=${PG_MAX_CONNECTIONS:-120}",
        "-c", "log_min_duration_statement=${PG_LOG_MIN_DURATION_MS:-1000}",
        "-c", "log_min_messages=warning",
      ]

  # Kong: the Supabase API gateway (apikey → consumer check, Studio basic
  # auth). Caddy forwards only /auth/v1 and /rest/v1 of the public API host
  # here; the Studio catch-all is reachable solely via 127.0.0.1:8000.
  kong:
    container_name: campfire-kong
    image: kong/kong:3.9.3
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KONG_HTTP_PORT:-8000}:8000"
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro,z
      - ./volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,z
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      # Request-line buffer: a PostgREST IN filter of a few hundred storage
      # keys is 25-30 KB once URL-encoded and nginx's 8 KB default answered
      # 414 (#657). The clients also batch by encoded length now.
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: 4 64k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      # Caddy terminates TLS; Kong must trust its X-Forwarded-* headers.
      KONG_TRUSTED_IPS: 0.0.0.0/0,::/0
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      # Opaque sb_* keys are not used (legacy HS256 keys carried over from the
      # hosted project); leaving these empty keeps the entrypoint on the
      # pass-through branch.
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]

  auth:
    container_name: campfire-auth
    # Must be >= the hosted project's GoTrue at cutover so its auth-schema
    # migrations only ever run forward (ops/README.md, cutover checklist).
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      # Legacy symmetric HS256 key: the hosted project's secret, so existing
      # anon/service keys, browser sessions and CLI refresh tokens stay valid.
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      # supabase/config.toml [auth] / [auth.email] parity
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"      # double_confirm_changes
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "false"  # secure_password_change
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-6}
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_MAILER_OTP_EXP: "3600"
      GOTRUE_SMTP_MAX_FREQUENCY: ${SMTP_MAX_FREQUENCY:-1s}
      # [auth.rate_limit] (per hour unless noted; see .env.example)
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${RATE_LIMIT_EMAIL_SENT:-30}
      GOTRUE_RATE_LIMIT_SMS_SENT: ${RATE_LIMIT_SMS_SENT:-30}
      GOTRUE_RATE_LIMIT_ANONYMOUS_USERS: ${RATE_LIMIT_ANONYMOUS_USERS:-30}
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: ${RATE_LIMIT_TOKEN_REFRESH:-150}
      GOTRUE_RATE_LIMIT_OTP: ${RATE_LIMIT_SIGN_IN_SIGN_UPS:-30}
      GOTRUE_RATE_LIMIT_VERIFY: ${RATE_LIMIT_TOKEN_VERIFICATIONS:-30}

      # Resend SMTP
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-465}
      GOTRUE_SMTP_USER: ${SMTP_USER:-resend}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-CAMPFIRE}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # Email templates exported from the hosted dashboard, served by Caddy
      # from $CAMPFIRE_DATA_ROOT/auth-templates. Unset → GoTrue defaults.
      GOTRUE_MAILER_TEMPLATES_INVITE: ${MAILER_TEMPLATES_INVITE:-}
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${MAILER_TEMPLATES_CONFIRMATION:-}
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${MAILER_TEMPLATES_RECOVERY:-}
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${MAILER_TEMPLATES_MAGIC_LINK:-}
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: ${MAILER_TEMPLATES_EMAIL_CHANGE:-}
      GOTRUE_MAILER_SUBJECTS_INVITE: ${MAILER_SUBJECTS_INVITE:-You have been invited}
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: ${MAILER_SUBJECTS_CONFIRMATION:-Confirm your signup}
      GOTRUE_MAILER_SUBJECTS_RECOVERY: ${MAILER_SUBJECTS_RECOVERY:-Reset your password}
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: ${MAILER_SUBJECTS_MAGIC_LINK:-Your magic link}
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: ${MAILER_SUBJECTS_EMAIL_CHANGE:-Confirm email change}

  rest:
    container_name: campfire-rest
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,graphql_public}
      # Copy the hosted value (Dashboard → Settings → API → Max rows) before
      # cutover; a lower value silently truncates every list response.
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public,extensions}
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_POOL: ${PGRST_DB_POOL:-20}
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  meta:
    container_name: campfire-meta
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  # Studio is reached through Kong's catch-all (basic auth) on 127.0.0.1:8000
  # only: `ssh -L 8000:127.0.0.1:8000 <vm>` then http://localhost:8000.
  studio:
    container_name: campfire-studio
    image: supabase/studio:2026.10.12-sha-3699278
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      meta:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})\""
        ]
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 20s
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,graphql_public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public,extensions}
      DEFAULT_ORGANIZATION_NAME: CAMPFIRE
      DEFAULT_PROJECT_NAME: campfire
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"

  web:
    container_name: campfire-web
    # Built by web/Dockerfile and pushed to GHCR by the deploy workflow (step 5).
    # deploy.sh overrides WEB_TAG per release and persists it to .env.
    image: ${WEB_IMAGE:-ghcr.io/hollisakins/campfire-web}:${WEB_TAG:-main}
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    env_file:
      # Server-only secrets (service role key, JWT secrets, S3/OSN, Resend, …).
      # NEXT_PUBLIC_* values are baked into the image and ignored here.
      - ./web.env

  # Public read-only SQL (Catalog Read Model phase 4, docs/reader-role.md).
  # PgBouncer in transaction mode in front of db for the campfire_reader role
  # only. Clients log in without a password (auth_type trust: the data is
  # public and the role's grants are the gate); trust still requires the
  # client's user name to be in the userlist, which holds that one role, so no
  # other name gets a server connection. The pooler itself logs in to db with
  # the role's password (READER_PASSWORD, plaintext in the userlist: it grants
  # nothing the pooler does not already grant everyone). The role's own
  # settings (statement timeout, read-only transactions, connection limit)
  # bound what a session can do. Listens on the default Postgres port so the
  # published string needs none, bound to the VM's interface address
  # (READER_BIND, detected and written to .env by scripts/reader-setup.sh):
  # db publishes 127.0.0.1:$POSTGRES_PORT for deploy.sh and the operator, and
  # one host port cannot be 0.0.0.0 for the pooler and 127.0.0.1 for db at
  # once. The security group has to admit READER_PORT and db.$WEB_HOST is a
  # DNS-only record (Cloudflare's proxy carries no Postgres).
  # TLS from pgbouncer/reader.pem + reader.key
  # (self-signed by scripts/reader-setup.sh; the pooler refuses plaintext,
  # libpq's default sslmode=prefer negotiates it). Enabled by the
  # reader profile so a stack without a reader password runs unchanged:
  #   docker compose --profile reader up -d pgbouncer
  pgbouncer:
    container_name: campfire-pgbouncer
    image: edoburu/pgbouncer:v1.26.1-p0
    restart: unless-stopped
    logging: *default-logging
    profiles: ["reader"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${READER_BIND:-0.0.0.0}:${READER_PORT:-5432}:6432"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_USER: campfire_reader
      DB_PASSWORD: ${READER_PASSWORD}
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      AUTH_TYPE: trust
      AUTH_FILE: /etc/pgbouncer-reader/userlist.txt
      MAX_CLIENT_CONN: ${READER_MAX_CLIENT_CONN:-200}
      DEFAULT_POOL_SIZE: ${READER_POOL_SIZE:-10}
      RESERVE_POOL_SIZE: 2
      # every public client shares one backend role: DISCARD ALL after every
      # transaction (not only in session mode), so a SET, a temp table that
      # would shadow public.objects or a prepared statement never reaches the
      # next reader on the same server connection (Codex on the phase 4 PR)
      SERVER_RESET_QUERY: DISCARD ALL
      SERVER_RESET_QUERY_ALWAYS: 1
      MIN_POOL_SIZE: 2
      SERVER_LIFETIME: 3600
      SERVER_IDLE_TIMEOUT: 300
      CLIENT_IDLE_TIMEOUT: 600
      QUERY_TIMEOUT: 60
      CLIENT_TLS_SSLMODE: require
      CLIENT_TLS_KEY_FILE: /etc/pgbouncer-reader/reader.key
      CLIENT_TLS_CERT_FILE: /etc/pgbouncer-reader/reader.pem
      SERVER_TLS_SSLMODE: disable
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      ADMIN_USERS: ""
      STATS_USERS: ""
    volumes:
      # one world-traversable directory of its own (userlist, the heal's
      # verifier record, certificate):
      # certs/ is 0750 for the ops user and the container runs as its own uid
      - ${CAMPFIRE_DATA_ROOT:-/srv/campfire}/pgbouncer:/etc/pgbouncer-reader:ro
    healthcheck:
      # -d: without it pg_isready asks for a database named after the user,
      # which the pooler logs as a (nodb) login attempt on every probe
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U campfire_reader -d ${POSTGRES_DB:-postgres} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  caddy:
    container_name: campfire-caddy
    image: caddy:2.10
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      web:
        condition: service_started
      kong:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WEB_HOST: ${WEB_HOST}
      WEB_STAGING_HOST: ${WEB_STAGING_HOST}
      # docker-compose.staging.yml overrides this with web-staging:3000.
      WEB_STAGING_UPSTREAM: ${WEB_STAGING_UPSTREAM:-web:3000}
      API_HOST: ${API_HOST}
      # The same three roles in the alternate zone (README, "Domain move"):
      # redirects for the portals, a live alias for the API. The *.invalid
      # defaults keep the Caddyfile blocks inert (and the certificate at
      # certs/alt.pem must exist either way: copy origin.pem/.key to alt.pem/.key
      # before the first start with this file).
      ALT_WEB_HOST: ${ALT_WEB_HOST:-alt-web.invalid}
      ALT_WEB_STAGING_HOST: ${ALT_WEB_STAGING_HOST:-alt-staging.invalid}
      ALT_API_HOST: ${ALT_API_HOST:-alt-api.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CAMPFIRE_DATA_ROOT:-/srv/campfire}/certs:/certs:ro
      - ${CAMPFIRE_DATA_ROOT:-/srv/campfire}/auth-templates:/srv/auth-templates:ro
      # Access log (Caddyfile `log`), readable from the host.
      - ${CAMPFIRE_DATA_ROOT:-/srv/campfire}/logs/caddy:/var/log/caddy
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-config:
  caddy-data:
  caddy-config:

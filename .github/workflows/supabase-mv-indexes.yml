name: Supabase schema guards

# Runs every self-contained guard in supabase/tests/ (check_*.sql, each
# BEGIN ... ROLLBACK) against a database built from the migration chain:
# - check_mv_unique_indexes.sql: every public materialized view must have a
#   unique index (REFRESH ... CONCURRENTLY fails without one, and migra does
#   not track MV indexes, so a migra-generated drop/recreate can silently
#   strip them).
# - check_object_aggregate_scoping.sql / check_grating_filter_scoping.sql /
#   check_share_link_scoping.sql: viewer-scoping invariants on the catalog
#   RPCs (anti-leak aggregates, issue-#488 grating filtering, share links).

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/schemas/**"
      - "supabase/tests/**"
      - ".github/workflows/supabase-mv-indexes.yml"

# Cancel superseded runs on the same PR to save Actions minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id kept from the original MV-only guard so existing branch-protection
  # required checks stay valid.
  check-mv-indexes:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Postgres
        run: supabase db start

      - name: Apply migrations
        # Migrations only (no seed): the guards build their own fixtures
        # inside rolled-back transactions, and skipping the seed keeps this
        # job fast and focused.
        run: supabase db reset --no-seed

      - name: Run schema guard tests
        # Fixed local connection string (db.port = 54322 in supabase/config.toml).
        env:
          DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          set -e
          for f in supabase/tests/check_*.sql; do
            echo "== $f"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

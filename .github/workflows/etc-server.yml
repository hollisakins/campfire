name: NIRSpec ETC server

# Test and deploy the empirical NIRSpec ETC (etc/): the numpy-only calculator,
# the MCP server, and the bundled noise-model JSON.
#
# Tests run on every PR that touches etc/; a merge to main test-gates and then
# deploys the hosted MCP server to Fly.io (see etc/fly.toml).
#
# Required repository secret:
#   FLY_API_TOKEN — a deploy token for the campfire-etc app
#                   (`fly tokens create deploy -x 999999h` from etc/).

on:
  push:
    branches: [main]
    paths:
      - "etc/**"
      - ".github/workflows/etc-server.yml"
  pull_request:
    paths:
      - "etc/**"
      - ".github/workflows/etc-server.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: etc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Server starts and answers /health
        run: |
          campfire-etc serve --http --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8765/health | grep -q '"ok": *true'

  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: etc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
